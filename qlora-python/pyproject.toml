[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "qlora-wgpu"
version = "0.1.0"
description = "QLoRA operations (NF4 quantization, LoRA, fused linear) with WGPU acceleration"
requires-python = ">=3.8"

[tool.maturin]
module-name = "qlora_wgpu"
bindings = "pyo3"
features = ["pyo3/extension-module"]
